version: '3.7'

networks:
  k6:
  grafana:

services:
  influxdb:
    image: influxdb:1.8
    networks:
      - k6
      - grafana
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=k6

  grafana:
    image: grafana/grafana:8.2.1
    networks:
      - grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
    volumes:
      - ./visualisation/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml

  app:
    image: node:22-alpine
    command: node --max-old-space-size=32 /app/server.js
    restart: unless-stopped
    networks:
      - k6
    ports:
      - "8080:8080"
    environment:
      - WORKERS=10
    volumes:
      - ./server:/app

  k6:
    image: grafana/k6:latest
    depends_on:
      - app
    networks:
      - k6
    ports:
      - "6565:6565"
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    volumes:
      - ./scripts:/scripts
